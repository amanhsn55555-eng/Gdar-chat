<body>

<!-- بنر متحرك -->
<div class="animated-banner">

  </div>

  </div>

</div>

<div class="posts-grid" id="postsContainer">

</div>

<div class="simple-footer">
 <div class="quick-publish">

<div id="toastMsg"></div>

<!-- نافذة الملف الشخصي -->
<div class="modal-overlay" id="profileModal">

    <button class="close-modal-btn" onclick="closeProfileModal()">&times;</button>

  </div>
</div>

<!-- نافذة التعليقات -->
<div class="modal-overlay" id="commentsModal">
  <div class="comments-modal">
    <div class="comments-header">
      <h3 style="font-size: 15px;"><i class="fas fa-comments"></i> التعليقات</h3>
      <button class="close-modal-btn" onclick="closeCommentsModal()" style="float:none;">&times;</button>
    </div>
    <div id="miniPostContainer" class="mini-post"></div>
    <div class="comments-list" id="commentsList"></div>
    <div class="comment-input-area">
      <input type="text" id="commentInput" placeholder="اكتب تعليقاً...">
      <button onclick="submitComment()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
  import { getFirestore, collection, query, getDocs, addDoc, updateDoc, deleteDoc, doc, onSnapshot, arrayUnion, arrayRemove, increment, setDoc, getDoc, where, orderBy } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCPBrZMo6IYCwCDYV3HEfNcUmLUITR6VRc",
    authDomain: "elahbes.firebaseapp.com",
    projectId: "elahbes",
    storageBucket: "elahbes.firebasestorage.app",
    messagingSenderId: "800207969145",
    appId: "1:800207969145:web:aa19b725d1c92dd48fada8"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentUserData = null;
  let posts = [];
  let followers = {};
  let activePostForComments = null;

  const defaultEmojis = ['😎', '👑', '🦊', '🐼', '🐸', '🦁', '🐨', '⭐'];

  function showToast(msg, isError = false) {
    const t = document.getElementById('toastMsg');
    t.textContent = msg;
    t.style.background = isError ? '#ef4444' : '#10b981';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  async function loadCurrentUserData(uid) {
    try {
      const userDoc = await getDoc(doc(db, "users", uid));
      if (userDoc.exists()) {
        currentUserData = userDoc.data();
        if (!currentUserData.colors) currentUserData.colors = { frame: '#fbbf24' };
      } else {
        const userId = uid.slice(0, 6);
        currentUserData = {
          userId: userId,
          username: 'مستخدم' + userId,
          emoji: defaultEmojis[Math.floor(Math.random() * defaultEmojis.length)],
          avatarType: 'emoji',
          avatarUrl: '',
          bio: 'مرحباً! 👋',
          colors: { frame: '#fbbf24' }
        };
        await setDoc(doc(db, "users", uid), currentUserData);
        await setDoc(doc(db, "users_by_id", userId), { uid: uid });
      }
      const followersDoc = await getDoc(doc(db, "social", "followers"));
      if (followersDoc.exists()) followers = followersDoc.data();
      else followers = {};
    } catch (e) { console.error(e); }
  }
function renderPosts() {
    const container = document.getElementById('postsContainer');
    if (!container) return;
    
    if (posts.length === 0) {
      container.innerHTML = '<div style="text-align:center;padding:40px;color:white;text-shadow:0 0 3px black;">📭 لا توجد منشورات</div>';
      return;
    }
    
    container.innerHTML = posts.sort((a,b) => (b.timestamp||0) - (a.timestamp||0)).map(post => {
      const isLiked = post.likedBy?.includes(currentUser?.uid) || false;
      let mediaHtml = '';
      if (post.mediaUrl) {
        if (post.mediaType === 'image') {
          mediaHtml = `<div class="post-media"><img src="${post.mediaUrl}" loading="lazy" onerror="this.style.display='none'"></div>`;
        } else if (post.mediaType === 'youtube') {
          mediaHtml = `<div class="post-media"><iframe src="${post.mediaUrl}" frameborder="0" allowfullscreen></iframe></div>`;
        }
      }
      
      const frameColor = post.colors?.frame || '#fbbf24';
      const nameDisplay = post.nameImage ? 
        `<img src="${post.nameImage}" class="name-image">` : 
        (post.username || 'مستخدم');
      
      return `
        <div class="post-card">
          <div class="post-header-row">
            <div class="post-avatar" style="border-color: ${frameColor};" onclick="window.openUserProfile('${post.userId}')">
              ${post.avatarType === 'image' && post.avatarUrl ? `<img src="${post.avatarUrl}">` : `<span>${post.emoji || '👤'}</span>`}
            </div>
            <div class="post-user-info">
              <div class="post-username" onclick="window.openUserProfile('${post.userId}')">
                ${nameDisplay}
                <span class="user-id-badge" style="background: ${frameColor};">#${post.userId}</span>
                ${post.verified ? '<i class="fas fa-check-circle verified-badge"></i>' : ''}
              </div>
            </div>
            <div style="margin-right: auto; font-size: 11px; color: #888; font-weight: normal; white-space: nowrap;">
              <i class="far fa-clock"></i> ${timeAgo(post.timestamp)}
            </div>
          </div>
          <div class="post-content">
            <div class="post-text">${post.content || ''}</div>
            ${mediaHtml}
          </div>
          <div class="post-actions">
            <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="window.toggleLike('${post.id}')">
              <i class="fas fa-heart"></i> <span>${post.likes || 0}</span>
            </button>
            <button class="action-btn" onclick="window.openCommentsModal('${post.id}')">
              <i class="fas fa-comment"></i> <span>${post.comments?.length || 0}</span>
            </button>
      ${post.userId === currentUserData?.userId ? `
  <button class="action-btn delete-post-btn" onclick="window.deletePost('${post.id}')">
    <i class="fas fa-trash"></i>
  </button>
` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  window.toggleLike = async function(postId) {
    if (!currentUser) { showToast('الرجاء تسجيل الدخول', true); return; }
    const post = posts.find(p => p.id === postId);
    if (!post) return;
    const isLiked = post.likedBy?.includes(currentUser.uid);
    const postRef = doc(db, "user_posts", postId);
    if (isLiked) {
      await updateDoc(postRef, { likedBy: arrayRemove(currentUser.uid), likes: increment(-1) });
    } else {
      await updateDoc(postRef, { likedBy: arrayUnion(currentUser.uid), likes: increment(1) });
    }
  };

  window.openCommentsModal = function(postId) {
    const post = posts.find(p => p.id === postId);
    if (!post) return;
    activePostForComments = post;
    
    const miniContainer = document.getElementById('miniPostContainer');
    miniContainer.innerHTML = `
      <div class="mini-avatar" onclick="window.openUserProfile('${post.userId}')" style="cursor:pointer;">
        ${post.avatarType === 'image' && post.avatarUrl ? `<img src="${post.avatarUrl}" style="width:100%;height:100%;object-fit:cover;">` : `<span>${post.emoji || '👤'}</span>`}
      </div>
      <div style="flex:1">
        <div style="font-weight:bold;font-size:12px;" onclick="window.openUserProfile('${post.userId}')" style="cursor:pointer;">${post.username} <span style="font-size:9px;color:#888;">#${post.userId}</span></div>
        <div style="font-size:11px;color:#666;">${post.content?.substring(0, 50) || ''}${post.content?.length > 50 ? '...' : ''}</div>
      </div>
    `;
    
    const comments = post.comments || [];
    const commentsList = document.getElementById('commentsList');
    if (comments.length === 0) {
      commentsList.innerHTML = '<p style="text-align:center;color:#888;padding:20px;">لا توجد تعليقات</p>';
    } else {
      commentsList.innerHTML = comments.sort((a,b) => (b.timestamp||0) - (a.timestamp||0)).map(c => {
        const isOwner = c.userId === currentUserData?.userId;
        return `
          <div class="comment-item">
            <div class="comment-right">
              <div class="comment-avatar-sm">${c.avatarType === 'image' && c.avatarUrl ? `<img src="${c.avatarUrl}" style="width:100%;height:100%;border-radius:10px;">` : (c.emoji || '👤')}</div>
              <div class="comment-details">
                <div class="comment-author">${c.username} <span style="font-size:9px;color:#888;">#${c.userId}</span></div>
                <div class="comment-text">${c.text}</div>
              </div>
            </div>
            ${isOwner ? `<button class="delete-comment" onclick="window.deleteComment('${post.id}', '${c.id}')"><i class="fas fa-trash"></i></button>` : ''}
          </div>
        `;
      }).join('');
    }
    document.getElementById('commentsModal').classList.add('active');
    document.getElementById('commentInput').value = '';
  };

  window.deleteComment = async function(postId, commentId) {
    const post = posts.find(p => p.id === postId);
    if (!post) return;
    const comment = post.comments?.find(c => c.id === commentId);
    if (!comment) return;
    await updateDoc(doc(db, "user_posts", postId), {
      comments: arrayRemove(comment)
    });
    showToast("✅ تم حذف التعليق");
    window.openCommentsModal(postId);
  };

  window.submitComment = async function() {
    if (!currentUser) { showToast('يجب تسجيل الدخول', true); return; }
    if (!activePostForComments) return;
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text) return;
    const newComment = {
      id: Date.now() + Math.random().toString(36),
      userId: currentUserData.userId,
      username: currentUserData.username,
      emoji: currentUserData.emoji,
      avatarType: currentUserData.avatarType,
      avatarUrl: currentUserData.avatarUrl,
      text: text,
      timestamp: Date.now()
    };
    await updateDoc(doc(db, "user_posts", activePostForComments.id), {
      comments: arrayUnion(newComment)
    });
    input.value = '';
    window.openCommentsModal(activePostForComments.id);
    showToast("✅ تم التعليق");
  };

  window.closeCommentsModal = function() {
    document.getElementById('commentsModal').classList.remove('active');
    activePostForComments = null;
  };

  window.quickPublish = async function() {
    if (!currentUser) { showToast('يجب تسجيل الدخول أولاً', true); return; }
    const input = document.getElementById('quickPostInput');
    let text = input.value.trim();
    if (!text) { showToast('اكتب شيئاً', true); return; }
    let mediaUrl = null;
    let mediaType = null;
    let content = text;
    const urlRegex = /(https?:\/\/[^\s]+)/g;
    const urls = text.match(urlRegex);
    if (urls && urls.length) {
      const firstUrl = urls[0];
      if (firstUrl.includes('youtube.com') || firstUrl.includes('youtu.be')) {
        let videoId = firstUrl.split('v=')[1]?.split('&')[0] || firstUrl.split('/').pop();
        mediaUrl = `https://www.youtube.com/embed/${videoId}`;
        mediaType = 'youtube';
        content = text.replace(firstUrl, '').trim() || '🎥 فيديو';
      } else if (firstUrl.match(/\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i)) {
        mediaUrl = firstUrl;
        mediaType = 'image';
        content = text.replace(firstUrl, '').trim() || '📸 صورة';
      }
    }
    const newPost = {
      userId: currentUserData.userId,
      username: currentUserData.username,
      emoji: currentUserData.emoji,
      avatarType: currentUserData.avatarType,
      avatarUrl: currentUserData.avatarUrl,
      colors: currentUserData.colors || {},
      verified: currentUserData.verified || false,
      nameImage: currentUserData.nameImage || null,
      content: content,
      mediaUrl: mediaUrl,
      mediaType: mediaType,
      timestamp: Date.now(),
      likes: 0,
      likedBy: [],
      comments: []
    };
    try {
      await addDoc(collection(db, "user_posts"), newPost);
      showToast("✨ تم النشر");
      input.value = '';
    } catch(e) { showToast("❌ فشل النشر", true); }
  };
window.deletePost = async function(postId) {
  if (!currentUser) return;
  if (confirm('هل أنت متأكد من حذف المنشور؟')) {
    await deleteDoc(doc(db, "user_posts", postId));
    showToast("🗑️ تم حذف المنشور");
  }
};
  window.openUserProfile = async function(userId) {
    if (!currentUser) return;
    let userData = null;
    if (userId === currentUserData.userId) {
      userData = currentUserData;
    } else {
      const usersSnapshot = await getDocs(query(collection(db, "users"), where("userId", "==", userId)));
      if (!usersSnapshot.empty) userData = usersSnapshot.docs[0].data();
    }
    if (!userData) userData = { username: 'مستخدم', userId: userId, emoji: '👤', bio: 'لا توجد معلومات' };
    
    const isOwn = userId === currentUserData.userId;
    const isFollow = followers[currentUser?.uid]?.includes(userId);
    
    const modalContent = document.getElementById('profileContent');
    modalContent.innerHTML = `
      <div class="profile-avatar-square">
        ${userData.avatarType === 'image' && userData.avatarUrl ? `<img src="${userData.avatarUrl}">` : `<span>${userData.emoji || '👤'}</span>`}
      </div>
      <h3 style="margin:10px 0 5px;">${userData.username}</h3>
      <p style="font-size:12px;color:#888;margin-bottom:15px;">#${userData.userId}</p>
      <p style="font-size:13px;margin-bottom:20px;">${userData.bio || 'مرحباً! 👋'}</p>
      <div class="profile-buttons">
        ${!isOwn ? `
          <button id="followProfileBtn" class="profile-btn btn-follow ${isFollow ? 'following' : ''}">
            <i class="fas ${isFollow ? 'fa-check' : 'fa-user-plus'}"></i> ${isFollow ? 'متابَع' : 'متابعة'}
          </button>
          <button id="messageProfileBtn" class="profile-btn btn-message">
            <i class="fas fa-comment"></i> مراسلة
          </button>
        ` : '<p style="width:100%;color:#888;padding:10px;">✨ هذا حسابك</p>'}
      </div>
    `;
    document.getElementById('profileModal').classList.add('active');
    
    if (!isOwn) {
      setTimeout(() => {
        const followBtn = document.getElementById('followProfileBtn');
        const messageBtn = document.getElementById('messageProfileBtn');
        
        if (followBtn) {
          followBtn.onclick = async () => {
            if (!followers[currentUser.uid]) followers[currentUser.uid] = [];
            const idx = followers[currentUser.uid].indexOf(userId);
            if (idx === -1) {
              followers[currentUser.uid].push(userId);
              showToast(`✅ متابعة ${userData.username}`);
              followBtn.innerHTML = '<i class="fas fa-check"></i> متابَع';
              followBtn.classList.add('following');
            } else {
              followers[currentUser.uid].splice(idx, 1);
              showToast(`❌ إلغاء متابعة ${userData.username}`);
              followBtn.innerHTML = '<i class="fas fa-user-plus"></i> متابعة';
              followBtn.classList.remove('following');
            }
            await setDoc(doc(db, "social", "followers"), { [currentUser.uid]: followers[currentUser.uid] }, { merge: true });
          };
        }
        
        if (messageBtn) {
          messageBtn.onclick = () => {
            const chatUrl = `https://amanhsn55555-eng.github.io/Msgtdy/?userId=${userData.userId}`;
            window.open(chatUrl, '_blank');
            closeProfileModal();
          };
        }
      }, 50);
    }
  };

  window.closeProfileModal = function() {
    document.getElementById('profileModal').classList.remove('active');
  };

  function subscribePosts() {
    const q = query(collection(db, "user_posts"), orderBy("timestamp", "desc"));
    onSnapshot(q, (snapshot) => {
      posts = [];
      snapshot.forEach(doc => {
        let data = doc.data();
        if (!data.comments) data.comments = [];
        if (!data.likedBy) data.likedBy = [];
        posts.push({ id: doc.id, ...data });
      });
      renderPosts();
    });
  }

  function subscribeToUserData() {
    if (!currentUser) return;
    const userRef = doc(db, "users", currentUser.uid);
    onSnapshot(userRef, (docSnap) => {
      if (docSnap.exists()) {
        currentUserData = docSnap.data();
        if (!currentUserData.colors) currentUserData.colors = { frame: '#fbbf24' };
        renderPosts();
      }
    });
  }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      await loadCurrentUserData(user.uid);
      subscribePosts();
      subscribeToUserData();
      document.getElementById('quickPublishBtn')?.addEventListener('click', () => window.quickPublish());
      document.getElementById('quickPostInput')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') window.quickPublish();
      });
    } else {
      document.getElementById('postsContainer').innerHTML = `<div style="text-align:center;padding:50px;color:white;text-shadow:0 0 3px black;">
        <i class="fas fa-sign-in-alt" style="font-size:40px;"></i>
        <p>الرجاء تسجيل الدخول</p>
        <button onclick="window.location.reload()" style="background:#fbbf24;border:none;padding:10px 20px;border-radius:30px;">تسجيل الدخول</button>
      </div>`;
    }
  });

  function toggleTheme() {
    document.body.classList.toggle('dark-mode');
    const icon = document.querySelector('#themeToggleBtn i');
    if (document.body.classList.contains('dark-mode')) {
      icon.className = 'fas fa-sun';
      localStorage.setItem('theme', 'dark');
    } else {
      icon.className = 'fas fa-moon';
      localStorage.setItem('theme', 'light');
    }
  }
  document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
  if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
function timeAgo(timestamp) {
  const now = Date.now();
  const seconds = Math.floor((now - timestamp) / 1000);
  
  if (seconds < 60) return 'الآن';
  
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `منذ ${minutes} دقيقة`;
  
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `منذ ${hours} ساعة`;
  
  const days = Math.floor(hours / 24);
  if (days < 7) return `منذ ${days} يوم`;
  
  const weeks = Math.floor(days / 7);
  if (weeks < 4) return `منذ ${weeks} أسبوع`;
  
  const months = Math.floor(days / 30);
  if (months < 12) return `منذ ${months} شهر`;
  
  const years = Math.floor(days / 365);
  return `منذ ${years} سنة`;
}
